name: "Release"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty to use version from manifest.json, e.g. v0.4.0)"
        required: false
        type: string
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v6.0.1"

      - name: "Determine release tag"
        id: tag
        shell: "bash"
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(jq -r '.version' "${{ github.workspace }}/custom_components/openmetrics/manifest.json")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/openmetrics"
          zip openmetrics.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: "softprops/action-gh-release@v2.5.0"
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: ${{ github.workspace }}/custom_components/openmetrics/openmetrics.zip